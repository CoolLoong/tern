name: Bug report
description: Report a reproducible Tern problem using synthetic files.
body:
  - type: markdown
    attributes:
      value: |
        Remove personal paths and document contents from diagnostics.
        For sensitive issues, follow SECURITY.md instead of posting details here.
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Distribution, compositor and display backend
      placeholder: e.g. Arch Linux, Niri, Wayland
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include expected and observed behavior, using invented filenames.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Redacted diagnostics
      description: Do not include secrets, full environment dumps or private documents.
      render: text
